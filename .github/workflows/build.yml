name: build libluajava

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: List files
        run: |
          find . -name "Android.mk"
          echo "---"
          cat app/src/main/jni/Application.mk

      - name: Build libluajava
        run: |
          cd app/src/main/jni
          ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=./Application.mk APP_BUILD_SCRIPT=./Android.mk APP_ABI=arm64-v8a NDK_DEBUG=0

      - uses: actions/upload-artifact@v4
        with:
          name: libluajava-arm64
          path: |
            **/libs/arm64-v8a/*.so
            **/obj/local/arm64-v8a/*.so
          if-no-files-found: warn
